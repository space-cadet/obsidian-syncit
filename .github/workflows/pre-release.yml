name: Pre-Release Build (main branch)

on:
    push:
        branches:
            - main

env:
    PLUGIN_NAME: obsidian-syncit

jobs:
    pre-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set Up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set Up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.22.3"
                  cache: "pnpm"

            - name: Inject build metadata into manifest
              run: |
                  COMMIT_HASH=$(git rev-parse HEAD)
                  BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  jq --arg hash "$COMMIT_HASH" --arg date "$BUILD_DATE" --arg branch "$GITHUB_REF_NAME" \
                      '. + {commitHash: $hash, buildDate: $date, buildBranch: $branch}' \
                      manifest.json > manifest.json.tmp
                  mv manifest.json.tmp manifest.json
                  echo "Injected commit hash: $COMMIT_HASH"
                  echo "Injected build date: $BUILD_DATE"

            - name: Install and Build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Verify Build Output
              run: |
                  test -f main.js || (echo "Build failed: main.js not found" && exit 1)

            - name: Prepare Release Assets
              run: |
                  mkdir -p $PLUGIN_NAME
                  cp main.js manifest.json styles.css $PLUGIN_NAME
                  zip -r ${PLUGIN_NAME}.zip $PLUGIN_NAME

            - name: Update latest-dev tag to current commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -f latest-dev
                  git push -f origin latest-dev

            - name: Create or Update Pre-Release
              uses: ncipollo/release-action@v1
              with:
                  tag: latest-dev
                  name: "Dev Build (latest main)"
                  body: |
                      Automated pre-release build from the latest commit on `main`.

                      **Commit:** `${{ github.sha }}`
                      **Built at:** ${{ github.event.head_commit.timestamp }}

                      Not for production use.
                  prerelease: true
                  allowUpdates: true
                  # Keep existing assets until replacement uploads succeed. This
                  # prevents a transient GitHub 5xx from leaving the release
                  # without main.js or the other updater assets.
                  removeArtifacts: false
                  artifacts: |
                      ${{ env.PLUGIN_NAME }}.zip
                      main.js
                      manifest.json
                      styles.css
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
