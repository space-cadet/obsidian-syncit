name: Build Obsidian Plugin

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - main

env:
    PLUGIN_NAME: obsidian-syncit

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set Up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set Up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.22.3"
                  cache: "pnpm"

            - name: Install and Build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Verify Build Output
              run: |
                  test -f main.js || (echo "Build failed: main.js not found" && exit 1)
                  test -f manifest.json || (echo "Build failed: manifest.json not found" && exit 1)

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.PLUGIN_NAME }}-build
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  retention-days: 7
