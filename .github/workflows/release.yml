name: Build and Release Obsidian Plugin

on:
    push:
        tags:
            - "*"

env:
    PLUGIN_NAME: obsidian-syncit

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set Up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set Up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.22.3"
                  cache: "pnpm"

            - name: Install and Build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Verify Build Output
              run: |
                  test -f main.js || (echo "Build failed: main.js not found" && exit 1)

            - name: Prepare Release Assets
              run: |
                  test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME#v}"
                  sha256sum main.js manifest.json styles.css > release-sha256sums.txt

            - name: Attest main.js
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: main.js

            - name: Attest styles.css
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: styles.css

            - name: Create Release and Upload Assets
              uses: ncipollo/release-action@v1
              with:
                  tag: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  allowUpdates: true
                  removeArtifacts: true
                  artifacts: |
                      main.js
                      manifest.json
                      styles.css
                      release-sha256sums.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
